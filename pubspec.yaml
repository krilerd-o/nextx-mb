name: nextx_mobile
description: MOAI NEXT Mobile App - Flutter native app for App Store & Play Store.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.7.0
  provider: ^6.1.1
  go_router: ^14.6.2
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  image_picker: ^1.1.2
  file_picker: ^10.0.0
  alice: ^1.0.0-dev.12
  alice_http: ^1.0.6
  alice_dio: ^1.0.6
  permission_handler: ^11.4.0
  geolocator: ^13.0.2
  socket_io_client: ^2.0.3+1
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  phosphor_icons: ^3.0.1
  share_plus: ^10.1.4
  flutter_local_notifications: ^17.2.4
  package_info_plus: ^8.3.1
  webview_flutter: ^4.14.1
  google_sign_in: ^7.2.0
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
