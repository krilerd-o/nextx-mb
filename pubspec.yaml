name: nextx_mobile
description: MOAI NEXT Mobile App - Flutter native app for App Store & Play Store.
publish_to: 'none'
version: 0.4.0+4

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.7.0
  provider: ^6.1.1
  go_router: ^14.6.2
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  image_picker: ^1.1.2
  file_picker: ^10.0.0
  alice: ^1.0.0-dev.12
  alice_http: ^1.0.6
  alice_dio: ^1.0.6
  permission_handler: ^11.4.0
  geolocator: ^13.0.2
  socket_io_client: ^2.0.3+1
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  flutter_local_notifications: ^17.2.4
  package_info_plus: ^8.3.1
  webview_flutter: ^4.14.1
  google_sign_in: ^7.2.0
  local_auth: ^3.0.2
  google_maps_flutter: ^2.19.0
  cached_network_image: ^4.0.6
  lucide_icons_flutter: 4.0.1
  simple_icons: ^16.23.0
  device_info_plus: ^12.4.0
  timezone: ^0.9.4
  sign_in_with_apple: ^8.2.0
  huawei_push: ^6.15.0+300
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  mobile_scanner: ^7.5.0
  flutter_markdown_plus: ^1.0.12
  flutter_highlight: ^0.7.0
  connectivity_plus: ^7.3.1
  speech_to_text: ^7.5.0
  video_player: ^2.14.1
  gal: ^2.3.3
  record: ^7.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/isaac/
  # App fonts (OFL 1.1) — same choices as the web; default Google Sans.
  # Google Sans is subset to Latin + Thai to keep the app small.
  fonts:
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
        - asset: assets/fonts/GoogleSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GoogleSans-Bold.ttf
          weight: 700
    - family: IBMPlexSansThai
      fonts:
        - asset: assets/fonts/IBMPlexSansThai-Regular.ttf
        - asset: assets/fonts/IBMPlexSansThai-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansThai-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansThai-Bold.ttf
          weight: 700
    - family: Sarabun
      fonts:
        - asset: assets/fonts/Sarabun-Regular.ttf
        - asset: assets/fonts/Sarabun-Medium.ttf
          weight: 500
        - asset: assets/fonts/Sarabun-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sarabun-Bold.ttf
          weight: 700
    - family: BaiJamjuree
      fonts:
        - asset: assets/fonts/BaiJamjuree-Regular.ttf
        - asset: assets/fonts/BaiJamjuree-Medium.ttf
          weight: 500
        - asset: assets/fonts/BaiJamjuree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BaiJamjuree-Bold.ttf
          weight: 700
    - family: Maitree
      fonts:
        - asset: assets/fonts/Maitree-Regular.ttf
        - asset: assets/fonts/Maitree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Maitree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Maitree-Bold.ttf
          weight: 700
    - family: NotoSansThai
      fonts:
        - asset: assets/fonts/NotoSansThai-Regular.ttf
        - asset: assets/fonts/NotoSansThai-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansThai-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansThai-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSansThai-ExtraBold.ttf
          weight: 800
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf
