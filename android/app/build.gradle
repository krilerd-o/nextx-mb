plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Google Maps key: env MAPS_API_KEY (CI secret) or `MAPS_API_KEY=` in android/local.properties.
// Tester key (internal APKs): android/tester.properties + android/app/tester.keystore, both git-ignored.
def testerProps = new Properties()
def testerPropsFile = rootProject.file("tester.properties")
if (testerPropsFile.exists()) testerProps.load(new FileInputStream(testerPropsFile))
def testerKeyFile = file("tester.keystore")
if (!testerPropsFile.exists()) testerKeyFile = file("__missing_tester.keystore")

def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}
def mapsApiKey = System.getenv("MAPS_API_KEY") ?: (localProps.getProperty("MAPS_API_KEY") ?: "")

android {
    namespace = "com.moai.nextt.mobile"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId = "com.moai.nextt.mobile"
        minSdk = 29
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        manifestPlaceholders += [mapsApiKey: mapsApiKey]
    }

    signingConfigs {
        // Fixed key for debug + internal tester APKs, so the SHA-1 does not change
        // between builds (Google Sign-In matches package + SHA-1). Not for stores.
        // Kept out of git: CI writes it from a secret (see docs/GOOGLE_SIGNIN.md).
        if (testerKeyFile.exists()) {
            tester {
                storeFile = testerKeyFile
                storePassword = testerProps["storePassword"]
                keyAlias = testerProps["keyAlias"]
                keyPassword = testerProps["keyPassword"]
            }
        }
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        debug {
            if (testerKeyFile.exists()) signingConfig = signingConfigs.tester
        }
        release {
            // Keeps the Huawei Push SDK working after R8 shrinking.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            } else if (System.getenv("NX_ALLOW_DEBUG_SIGNING") == "1") {
                // Internal side-load builds only — never upload a tester-signed bundle to a store.
                logger.warn("WARNING: android/key.properties missing — internal release build is signed with the tester/debug key (NX_ALLOW_DEBUG_SIGNING=1).")
                signingConfig = testerKeyFile.exists() ? signingConfigs.tester : signingConfigs.debug
            } else {
                signingConfig = null
            }
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    // AppCompat launch theme (local_auth biometric prompt on Android 8 and below).
    implementation 'androidx.appcompat:appcompat:1.7.0'
}

if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

// Fail fast instead of silently producing a debug-signed store build.
gradle.taskGraph.whenReady { graph ->
    def releaseTasks = graph.allTasks.findAll { it.project == project && it.name ==~ /(?i)(assemble|bundle|package)Release/ }
    if (!releaseTasks.isEmpty() && !keystorePropertiesFile.exists() && System.getenv("NX_ALLOW_DEBUG_SIGNING") != "1") {
        throw new GradleException(
            "android/key.properties not found. Create it from key.properties.example for store builds, " +
            "or set NX_ALLOW_DEBUG_SIGNING=1 for an internal debug-signed APK."
        )
    }
}
