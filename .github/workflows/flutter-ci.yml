name: Flutter CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (errors and warnings fail the build)
        run: flutter analyze --no-fatal-infos

      - name: Unit and widget tests
        run: flutter test

  build-android:
    needs: analyze-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Debug APK (no signing keys needed)
        run: |
          flutter pub get
          flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      # Small per-CPU release APKs for testers (~25 MB instead of the 176 MB
      # debug build). Signed with the debug key — NOT for Play Store upload.
      - name: Release APKs per CPU (tester build)
        env:
          NX_ALLOW_DEBUG_SIGNING: '1'
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: flutter build apk --release --split-per-abi --dart-define=NX_MAPS=${{ secrets.MAPS_API_KEY != '' && '1' || '0' }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-arm64-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-other-cpus
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 7
